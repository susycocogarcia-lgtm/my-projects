<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
</head>
<body>

  <div id="dashboard-container">
    <h2>Dashboard</h2>
    
    <div style="border: 1px solid #ccc; padding: 20px; max-width: 300px; margin-top: 20px;">
      <h3>Account Management</h3>
      <p><strong>Username:</strong> <span id="user-display">Loading...</span></p>
      <p><strong>Status:</strong> <span style="color: green;">Active</span></p>
      <button id="logout-btn">Log Out</button>
    </div>
  </div>

  <script>
    // Pull current user check straight from runtime window context
    const sessionToken = sessionStorage.getItem('verified_user_token');

    if (!sessionToken) {
      // Boot out immediately if user didn't fill out the matching login parameters
      window.location.href = "/";
    } else {
      document.getElementById('user-display').textContent = sessionToken;
    }

    // Terminate session token safely
    document.getElementById('logout-btn').addEventListener('click', () => {
      sessionStorage.removeItem('verified_user_token');
      window.location.href = "/";
    });
  </script>
</body>
</html>
