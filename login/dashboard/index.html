<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
</head>
<body>

  <div id="dashboard-container">
    <h2>Welcome to your Dashboard</h2>
    
    <div style="border: 1px solid #ccc; padding: 20px; max-width: 300px; margin-top: 20px;">
      <h3>Account Management</h3>
      <p><strong>Username:</strong> <span id="user-display">Loading...</span></p>
      <p><strong>Status:</strong> <span style="color: green;">Active</span></p>
      <button id="logout-btn">Log Out</button>
    </div>
  </div>

  <script>
    // Pull the active session identifier from immediate runtime memory
    const activeUser = sessionStorage.getItem('current_active_user');

    if (!activeUser) {
      // Boot out instantly to root page if accessed without verification credentials
      window.location.href = "/";
    } else {
      document.getElementById('user-display').textContent = activeUser;
    }

    // Terminate session state cleanly
    document.getElementById('logout-btn').addEventListener('click', () => {
      sessionStorage.removeItem('current_active_user');
      window.location.href = "/";
    });
  </script>
</body>
</html>
