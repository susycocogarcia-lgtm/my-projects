<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
</head>
<body>

  <div id="dashboard-container">
    <h2>Dashboard</h2>
    <div style="border: 1px solid #ccc; padding: 20px; max-width: 300px; margin-top: 20px;">
      <h3>Account Management</h3>
      <div>
        <span>Profile Icon: </span>
        <span id="avatar-letter" style="font-weight: bold; font-size: 20px; color: #0070f3;">?</span>
      </div>
      <div style="margin-top: 10px;">
        <span>Username:</span>
        <span id="user-display" style="font-weight: bold;">---</span>
      </div>
      <div>
        <span>Status:</span>
        <span style="color: #10b981; font-weight: bold;">Active</span>
      </div>
      <div>
        <span>Provider:</span>
        <span style="font-weight: bold;">Supabase Auth (Local Engine)</span>
      </div>
      <button id="logout-btn" style="margin-top: 15px; background-color: #ef4444; color: white; border: none; padding: 8px 12px; cursor: pointer; font-weight: bold;">Log Out</button>
    </div>
  </div>

  <script src="/supabase.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const SUPABASE_PROJECT_URL = "https://supabase.co"; 
      const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_zUbPyLcfNxTXRZH0_F3ZeA_b2ufw"; 

      const userDisplay = document.getElementById('user-display');
      const avatarLetter = document.getElementById('avatar-letter');

      if (typeof window.supabase === 'undefined') {
          window.location.href = "/login";
          return;
      }

      const supabase = window.supabase.createClient(SUPABASE_PROJECT_URL, SUPABASE_PUBLISHABLE_KEY);

      // Verify active session locally
      const savedToken = window.localStorage.getItem("sb-hyprnlxarrmzbubdkuk-auth-token");
      if (!savedToken) {
        window.location.href = "/login";
      } else {
        try {
          const parsed = JSON.parse(savedToken);
          const email = parsed.user?.email || parsed.email || "";
          const username = email.split('@')[0];
          
          userDisplay.textContent = username;
          if (username.length > 0) {
            avatarLetter.textContent = username.charAt(0).toUpperCase();
          }
        } catch(e) {
          window.location.href = "/login";
        }
      }

      document.getElementById('logout-btn').addEventListener('click', async () => {
        await supabase.auth.signOut();
        window.location.href = "/login";
      });
    });
  </script>
</body>
</html>
