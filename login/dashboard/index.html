<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
</head>
<body>

  <!-- Main visible dashboard workspace -->
  <div id="dashboard-container">
    <h2>Welcome to your Dashboard</h2>
    
    <div style="border: 1px solid #ccc; padding: 20px; max-width: 300px; margin-top: 20px;">
      <h3>Account Management</h3>
      <p><strong>Username:</strong> <span id="user-display">Loading...</span></p>
      <p><strong>Status:</strong> <span style="color: green;">Active</span></p>
      <button id="logout-btn">Log Out</button>
    </div>
  </div>

  <script>
    const PROJECT_ID = "hyprnlxarrmzbubdkuk";

    // 1. Instantly check if the user is allowed to be here
    const savedTokenData = localStorage.getItem(`sb-${PROJECT_ID}-auth-token`);
    
    if (!savedTokenData) {
      // Not logged in? Boot them straight back to the main login root page
      window.location.href = "/";
    } else {
      try {
        const session = JSON.parse(savedTokenData);
        
        // Extract the clean username from the synthetic email string
        const fullEmail = session.user?.email || session.email || "";
        const username = fullEmail.includes('@') ? fullEmail.split('@')[0] : fullEmail;
        
        // Render it to the screen text elements
        document.getElementById('user-display').textContent = username;
      } catch (error) {
        // If the token data is broken or corrupted, clear it and redirect to login
        localStorage.removeItem(`sb-${PROJECT_ID}-auth-token`);
        window.location.href = "/";
      }
    }

    // 2. Handle Logging Out cleanly
    document.getElementById('logout-btn').addEventListener('click', () => {
      localStorage.removeItem(`sb-${PROJECT_ID}-auth-token`);
      window.location.href = "/";
    });
  </script>
</body>
</html>
