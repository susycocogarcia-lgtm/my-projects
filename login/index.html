  <script src="https://jsdelivr.net"></script>
  <script>
    const SUPABASE_PROJECT_URL = "https://supabase.co"; 
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_zUbPyLcfNxTXRZH0_F3ZeA_b2ufw"; 

    const statusDiv = document.getElementById('status');
    const submitBtn = document.getElementById('submit-btn');

    if (typeof window.supabase === 'undefined') {
        statusDiv.textContent = "Initialization Error: Connection blocked by security layers.";
        statusDiv.style.color = "red";
    } else {
        const supabase = window.supabase.createClient(SUPABASE_PROJECT_URL, SUPABASE_PUBLISHABLE_KEY);

        supabase.auth.onAuthStateChange((event, session) => {
          if (session) {
            window.location.href = "/dashboard";
          }
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
          e.preventDefault();
          submitBtn.disabled = true;
          statusDiv.textContent = "Checking Supabase cloud ledger...";
          statusDiv.style.color = "black";

          const username = document.getElementById('login-username').value.trim().toLowerCase();
          const password = document.getElementById('login-password').value;
          const syntheticEmail = `${username}@projectsa.ink`;

          const { data, error } = await supabase.auth.signInWithPassword({
            email: syntheticEmail,
            password: password
          });

          if (error) {
            statusDiv.textContent = "Login Error: " + error.message;
            statusDiv.style.color = "red";
            submitBtn.disabled = false;
          }
        });
    }
  </script>
