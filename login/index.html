<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    body { font-family: sans-serif; max-width: 350px; margin: 80px auto; padding: 25px; border: 1px solid #ddd; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    h2 { margin-bottom: 20px; text-align: center; }
    form { display: flex; flex-direction: column; gap: 12px; }
    input, button { padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
    button { background-color: #0070f3; color: white; border: none; cursor: pointer; font-weight: bold; }
    button:hover { background-color: #0051a8; }
    .footer-text { margin-top: 15px; text-align: center; font-size: 14px; color: #555; }
    .footer-text a { color: #0070f3; text-decoration: none; }
    .footer-text a:hover { text-decoration: underline; }
    #status { font-size: 14px; text-align: center; margin-bottom: 15px; color: #d32f2f; font-weight: bold; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <h2>Login</h2>
  <div id="status"></div>

  <!-- LOGIN FORM -->
  <div id="auth-container">
    <form id="login-form">
      <input type="text" id="login-username" placeholder="Username" required />
      <input type="password" id="login-password" placeholder="Password" required />
      <button type="submit">Submit</button>
    </form>
    
    <p class="footer-text">
      no account? <a href="https://projectsa.ink">sign in</a>
    </p>
  </div>

  <!-- SUCCESS DASHBOARD -->
  <div id="dashboard-container" class="hidden">
    <h3>Welcome back!</h3>
    <p>You are successfully logged in.</p>
    <button id="logout-btn">Log Out</button>
  </div>

  <!-- Load Supabase from CDN & Logic App -->
  <script src="https://jsdelivr.net"></script>
  <script src="app.js"></script>
</body>
</html>
