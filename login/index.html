<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    .hidden { display: none; }
    #status { font-weight: bold; margin-bottom: 15px; }
  </style>
</head>
<body>

  <div id="status"></div>

  <div id="auth-container">
    <h2>Login</h2>
    <form id="login-form">
      <input type="text" id="login-username" placeholder="Username" required autocomplete="username" />
      <input type="password" id="login-password" placeholder="Password" required autocomplete="current-password" />
      <button type="submit" id="submit-btn">Submit</button>
    </form>
    
    <p>
      no account? <a href="https://projectsa.ink">sign in</a>
    </p>
  </div>

  <script src="https://unpkg.com"></script>
  
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const SUPABASE_PROJECT_URL = "https://supabase.co"; 
      const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_zUbPyLcfNxTXRZH0_F3ZeA_b2ufwe1T"; 

      const statusDiv = document.getElementById('status');
      const submitBtn = document.getElementById('submit-btn');

      if (typeof window.supabase === 'undefined') {
          statusDiv.textContent = "Script Initialization Error: Network infrastructure blocked library access.";
          statusDiv.style.color = "red";
          return;
      }

      const supabase = window.supabase.createClient(SUPABASE_PROJECT_URL, SUPABASE_PUBLISHABLE_KEY);

      // Check persistent browser tokens before drawing layout options
      const savedToken = window.localStorage.getItem("sb-hyprnlxarrmzbubdkuk-auth-token");
      if (savedToken) {
        window.location.href = "/dashboard";
      }

      document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        submitBtn.disabled = true;
        statusDiv.textContent = "Checking Supabase cloud ledger...";
        statusDiv.style.color = "black";

        const username = document.getElementById('login-username').value.trim().toLowerCase();
        const password = document.getElementById('login-password').value;
        const syntheticEmail = `${username}@projectsa.ink`;

        try {
          const { data, error } = await supabase.auth.signInWithPassword({
            email: syntheticEmail,
            password: password
          });

          if (error) {
            throw new Error(error.message);
          }

          // Commit active auth token values directly into session memory structures
          window.localStorage.setItem("sb-hyprnlxarrmzbubdkuk-auth-token", JSON.stringify(data.session));
          
          statusDiv.textContent = "Success! Redirecting to dashboard...";
          statusDiv.style.color = "green";
          window.location.href = "/dashboard";

        } catch (error) {
          statusDiv.textContent = "Login Error: " + error.message;
          statusDiv.style.color = "red";
          submitBtn.disabled = false;
        }
      });
    });
  </script>
</body>
</html>
