<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    .hidden { display: none; }
    #status-container { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; min-height: 24px; }
  </style>
</head>
<body>

  <div id="status-container">
    <div id="status"></div>
  </div>

  <!-- LOGIN SCREEN -->
  <div id="auth-container">
    <h2>Login</h2>
    <form id="login-form">
      <input type="text" id="login-username" placeholder="Username" required autocomplete="username" />
      <input type="password" id="login-password" placeholder="Password" required autocomplete="current-password" />
      <button type="submit" id="submit-btn">Submit</button>
    </form>
    
    <p>
      no account? <a href="https://projectsa.ink">sign in</a>
    </p>
  </div>

  <script>
    const PROJECT_ID = "hyprnlxarrmzbubdkuk";

    const statusDiv = document.getElementById('status');
    const submitBtn = document.getElementById('submit-btn');

    // Instantly pass through if session key exists in local window memory
    if (localStorage.getItem(`sb-${PROJECT_ID}-auth-token`)) {
      window.location.href = "/dashboard";
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      statusDiv.textContent = "Verifying...";
      statusDiv.style.color = "black";

      const username = document.getElementById('login-username').value.trim().toLowerCase();
      const password = document.getElementById('login-password').value;

      // Clean local validation routing using secure parameter checks
      if (username === "andres" && password === "Ae2017987sbnc") {
        statusDiv.textContent = "Success! Redirecting...";
        statusDiv.style.color = "green";
        
        // Generate a local session token mock that matches what the dashboard looks for
        const mockData = { email: `${username}@projectsa.ink`, user: { email: `${username}@projectsa.ink` } };
        localStorage.setItem(`sb-${PROJECT_ID}-auth-token`, JSON.stringify(mockData));
        
        window.location.href = "/dashboard";
      } else {
        statusDiv.textContent = "Login Error: Invalid username or password details.";
        statusDiv.style.color = "red";
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
