<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    .hidden { display: none; }
    #status { font-weight: bold; margin-bottom: 15px; }
  </style>
</head>
<body>

  <div id="status"></div>

  <div id="auth-container">
    <h2>Login</h2>
    <form id="login-form">
      <input type="text" id="login-username" placeholder="Username" required autocomplete="username" />
      <input type="password" id="login-password" placeholder="Password" required autocomplete="current-password" />
      <button type="submit" id="submit-btn">Submit</button>
    </form>
    <p>no account? <a href="https://projectsa.ink">sign in</a></p>
  </div>

  <script>
    const PROJECT_ID = "hyprnlxarrmzbubdkuk";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh5cHJubHhhcnJtemJidWJka3VrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQwMDc0MjcsImV4cCI6MjEwOTU4MzQyN30.p24H1MA2hxCmqElSNgOlDWwhQosXylOrZrLbsbrhVQo"; 

    const statusDiv = document.getElementById('status');
    const submitBtn = document.getElementById('submit-btn');

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      statusDiv.textContent = "Verifying credentials on live Supabase instance...";
      statusDiv.style.color = "black";

      const username = document.getElementById('login-username').value.trim().toLowerCase();
      const password = document.getElementById('login-password').value;
      const syntheticEmail = `${username}@projectsa.ink`;

      const targetEndpoint = `https://${PROJECT_ID}.supabase.co/auth/v1/token?grant_type=password`;
      const proxyUrl = `https://htmldriven.com{encodeURIComponent(targetEndpoint)}`;

      try {
        const response = await fetch(proxyUrl, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_KEY,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email: syntheticEmail, password: password })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error_description || data.error || "Invalid username or password");
        }

        // Establish real session verification parameter strings
        sessionStorage.setItem('active_dashboard_session', username);
        
        statusDiv.textContent = "Authenticated! Redirecting to workspace...";
        statusDiv.style.color = "green";
        window.location.href = "/login/dashboard";

      } catch (error) {
        statusDiv.textContent = "Login Error: " + error.message;
        statusDiv.style.color = "red";
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
