<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    .hidden { display: none; }
    #status-container { min-height: 24px; margin-bottom: 15px; font-weight: bold; }
  </style>
</head>
<body>

  <div id="status-container">
    <div id="status"></div>
  </div>

  <!-- LOGIN PORTAL CONTAINER -->
  <div id="auth-container">
    <h2>Login</h2>
    <form id="login-form">
      <input type="text" id="login-username" placeholder="Username" required autocomplete="username" />
      <input type="password" id="login-password" placeholder="Password" required autocomplete="current-password" />
      <button type="submit" id="submit-btn">Submit</button>
    </form>
    
    <p>
      no account? <a href="https://projectsa.ink">sign in</a>
    </p>
  </div>

  <script>
    const statusDiv = document.getElementById('status');
    const submitBtn = document.getElementById('submit-btn');

    // STATIC ACCOUNT LEDGER: Add authorized system usernames and passwords directly here
    const USER_DATABASE = {
      "andres": "Ae2017987sbnc",
      "admin": "projectsa2026",
      "testuser": "password123"
    };

    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      statusDiv.textContent = "Verifying profile parameters...";
      statusDiv.style.color = "black";

      const username = document.getElementById('login-username').value.trim().toLowerCase();
      const password = document.getElementById('login-password').value;

      // Immediate parameter assessment loop bypassing network layers completely
      if (USER_DATABASE[username] && USER_DATABASE[username] === password) {
        statusDiv.textContent = "Success! Routing to workspace...";
        statusDiv.style.color = "green";
        
        // Pass session identifier via safe, transient runtime storage variable
        sessionStorage.setItem('current_active_user', username);
        
        window.location.href = "/dashboard";
      } else {
        statusDiv.textContent = "Login Error: Invalid username or password details.";
        statusDiv.style.color = "red";
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
