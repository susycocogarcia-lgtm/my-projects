<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    .hidden { display: none; }
  </style>
</head>
<body>

  <!-- Status notifications appear here -->
  <div id="status"></div>

  <!-- LOGIN SCREEN -->
  <div id="auth-container">
    <h2>Login</h2>
    <form id="login-form">
      <input type="text" id="login-username" placeholder="Username" required />
      <input type="password" id="login-password" placeholder="Password" required />
      <button type="submit">Submit</button>
    </form>
    
    <p>
      no account? <a href="https://projectsa.ink">sign in</a>
    </p>
  </div>

  <!-- Load library using an alternative network route fallback -->
  <script src="https://cloudflare.com" integrity="sha512-+N/2yW9nB3qZ9h9s4xK4C8=" crossorigin="anonymous"></script>
  
  <script>
    // 1. Initialize Supabase Client Connection via global window context fallback
    const SUPABASE_URL = "https://supabase.co"; 
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh5cHJubHhhcnJtemJidWJka3VrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQwMDc0MjcsImV4cCI6MjEwOTU4MzQyN30.p24H1MA2hxCmqElSNgOlDWwhQosXylOrZrLbsbrhVQo"; 

    // Alternate loading declaration if first connection fails
    if (typeof window.supabase === 'undefined') {
      const script = document.createElement('script');
      script.src = "https://jsdelivr.net";
      script.onload = () => initSupabase();
      document.head.appendChild(script);
    } else {
      initSupabase();
    }

    function initSupabase() {
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const statusDiv = document.getElementById('status');
        statusDiv.textContent = "";

        // Automatically route to clean dashboard path if user session is valid
        supabase.auth.onAuthStateChange((event, session) => {
          if (session) {
            window.location.href = "/dashboard";
          }
        });

        // Handle Form Submission
        document.getElementById('login-form').addEventListener('submit', async (e) => {
          e.preventDefault();
          statusDiv.textContent = "Logging in...";
          statusDiv.style.color = "black";

          const username = document.getElementById('login-username').value.trim().toLowerCase();
          const password = document.getElementById('login-password').value;
          const syntheticEmail = `${username}@projectsa.ink`;

          const { data, error } = await supabase.auth.signInWithPassword({
            email: syntheticEmail,
            password: password
          });

          if (error) {
            statusDiv.textContent = "Login Error: " + error.message;
            statusDiv.style.color = "red";
          } else if (data && data.session) {
            window.location.href = "/dashboard";
          }
        });
    }
  </script>
</body>
</html>
