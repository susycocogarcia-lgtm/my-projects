<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    .hidden { display: none; }
    #status { font-weight: bold; margin-bottom: 15px; }
  </style>
</head>
<body>

  <div id="status"></div>

  <div id="auth-container">
    <h2>Login</h2>
    <form id="login-form">
      <input type="text" id="login-username" placeholder="Username" required autocomplete="username" />
      <input type="password" id="login-password" placeholder="Password" required autocomplete="current-password" />
      <button type="submit" id="submit-btn">Submit</button>
    </form>
    <p>no account? <a href="https://projectsa.ink">sign in</a></p>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const SUPABASE_PROJECT_URL = "https://hyprnlxarrmzbubdkuk.supabase.co"; 
      const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_zUbPyLcfNxTXRZH0_F3ZeA_b2ufwe1T"; 

      const statusDiv = document.getElementById('status');
      const submitBtn = document.getElementById('submit-btn');

      document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        submitBtn.disabled = true;
        statusDiv.textContent = "Verifying credentials against Supabase cloud...";
        statusDiv.style.color = "black";

        const username = document.getElementById('login-username').value.trim().toLowerCase();
        const password = document.getElementById('login-password').value;
        const syntheticEmail = `${username}@projectsa.ink`;

        try {
          const response = await fetch(`${SUPABASE_PROJECT_URL}/auth/v1/token?grant_type=password`, {
            method: 'POST',
            headers: {
              'apikey': SUPABASE_PUBLISHABLE_KEY,
              'Authorization': `Bearer ${SUPABASE_PUBLISHABLE_KEY}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ email: syntheticEmail, password: password })
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.error_description || data.error || "Invalid username or password");
          }

          // Save the actual authentication object returned from your active project server
          window.localStorage.setItem("sb-hyprnlxarrmzbubdkuk-auth-token", JSON.stringify(data));
          
          statusDiv.textContent = "Authenticated successfully! Redirecting...";
          statusDiv.style.color = "green";
          window.location.href = "/dashboard";

        } catch (error) {
          statusDiv.textContent = "Login Error: " + error.message;
          statusDiv.style.color = "red";
          submitBtn.disabled = false;
        }
      });
    });
  </script>
</body>
</html>
