<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    .hidden { display: none; }
    #status { font-weight: bold; margin-bottom: 15px; }
  </style>
</head>
<body>

  <div id="status"></div>

  <!-- LOGIN CONTAINER -->
  <div id="auth-container">
    <h2>Login</h2>
    <form id="login-form">
      <input type="text" id="login-username" placeholder="Username" required autocomplete="username" />
      <input type="password" id="login-password" placeholder="Password" required autocomplete="current-password" />
      <button type="submit" id="submit-btn">Submit</button>
    </form>
    
    <p>
      no account? <a href="https://projectsa.ink">sign in</a>
    </p>
  </div>

  <script>
    const statusDiv = document.getElementById('status');
    const submitBtn = document.getElementById('submit-btn');

    // SYSTEM USER LEDGER: Enter your credentials directly into the code below
    const VALID_USERS = {
      "andres": "Ae2017987sbnc"
    };

    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      statusDiv.textContent = "Verifying account details...";
      statusDiv.style.color = "black";

      const username = document.getElementById('login-username').value.trim().toLowerCase();
      const password = document.getElementById('login-password').value;

      // Evaluates immediately without hitting an external cloud firewall
      if (VALID_USERS[username] && VALID_USERS[username] === password) {
        statusDiv.textContent = "Success! Redirecting to workspace...";
        statusDiv.style.color = "green";
        
        // Save temporary user token to current tab runtime context
        sessionStorage.setItem('verified_user_token', username);
        window.location.href = "/dashboard";
      } else {
        statusDiv.textContent = "Login Error: Invalid username or password details.";
        statusDiv.style.color = "red";
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
