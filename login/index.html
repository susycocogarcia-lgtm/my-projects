<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    .hidden { display: none; }
  </style>
</head>
<body>

  <!-- Status notifications appear here -->
  <div id="status"></div>

  <!-- LOGIN SCREEN -->
  <div id="auth-container">
    <h2>Login</h2>
    <form id="login-form">
      <input type="text" id="login-username" placeholder="Username" required />
      <input type="password" id="login-password" placeholder="Password" required />
      <button type="submit">Submit</button>
    </form>
    
    <p>
      no account? <a href="https://projectsa.ink">sign in</a>
    </p>
  </div>

  <!-- Direct script path with explicit extension to satisfy Firefox security rules -->
  <script src="https://unpkg.com"></script>
  
  <script>
    // 1. Initialize Supabase Client Connection
    const SUPABASE_URL = "https://supabase.co"; 
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh5cHJubHhhcnJtemJidWJka3VrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQwMDc0MjcsImV4cCI6MjEwOTU4MzQyN30.p24H1MA2hxCmqElSNgOlDWwhQosXylOrZrLbsbrhVQo"; 

    // Confirm that the script loaded successfully in the browser context
    if (typeof window.supabase === 'undefined') {
        document.getElementById('status').textContent = "Critical Error: Supabase script failed to load. Check network connection.";
        document.getElementById('status').style.color = "red";
    } else {
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const statusDiv = document.getElementById('status');

        // Automatically route to clean dashboard path if user session is valid
        supabase.auth.onAuthStateChange((event, session) => {
          if (session) {
            window.location.href = "/dashboard";
          }
        });

        // Handle Form Submission
        document.getElementById('login-form').addEventListener('submit', async (e) => {
          e.preventDefault();
          statusDiv.textContent = "Logging in...";
          statusDiv.style.color = "black";

          const username = document.getElementById('login-username').value.trim().toLowerCase();
          const password = document.getElementById('login-password').value;
          const syntheticEmail = `${username}@projectsa.ink`;

          const { data, error } = await supabase.auth.signInWithPassword({
            email: syntheticEmail,
            password: password
          });

          if (error) {
            statusDiv.textContent = "Login Error: " + error.message;
            statusDiv.style.color = "red";
          } else if (data && data.session) {
            window.location.href = "/dashboard";
          }
        });
    }
  </script>
</body>
</html>
