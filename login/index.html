<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    .hidden { display: none; }
    
    #status-container {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
      min-height: 24px;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid #f3f3f3;
      border-top: 2px solid #0070f3;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: inline-block;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div id="status-container">
    <div id="loading-spinner" class="spinner hidden"></div>
    <div id="status"></div>
  </div>

  <!-- LOGIN SCREEN -->
  <div id="auth-container">
    <h2>Login</h2>
    <form id="login-form">
      <input type="text" id="login-username" placeholder="Username" required autocomplete="username" />
      <input type="password" id="login-password" placeholder="Password" required autocomplete="current-password" />
      <button type="submit" id="submit-btn">Submit</button>
    </form>
    
    <p>
      no account? <a href="https://projectsa.ink">sign in</a>
    </p>
  </div>

  <script>
    const PROJECT_ID = "hyprnlxarrmzbubdkuk";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh5cHJubHhhcnJtemJidWJka3VrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQwMDc0MjcsImV4cCI6MjEwOTU4MzQyN30.p24H1MA2hxCmqElSNgOlDWwhQosXylOrZrLbsbrhVQo"; 

    const statusDiv = document.getElementById('status');
    const spinnerElement = document.getElementById('loading-spinner');
    const submitBtn = document.getElementById('submit-btn');

    // Check if user is already logged in on page load
    const savedToken = localStorage.getItem(`sb-${PROJECT_ID}-auth-token`);
    if (savedToken) {
      window.location.href = "/dashboard";
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      submitBtn.disabled = true;
      spinnerElement.classList.remove('hidden');
      statusDiv.textContent = "Logging in...";
      statusDiv.style.color = "black";

      const username = document.getElementById('login-username').value.trim().toLowerCase();
      const password = document.getElementById('login-password').value;
      const syntheticEmail = `${username}@projectsa.ink`;

      try {
        // Direct native API call straight to Supabase Auth Endpoint
        const response = await fetch(`https://${PROJECT_ID}.supabase.co/auth/v1/token?grant_type=password`, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_KEY,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            email: syntheticEmail,
            password: password
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error_description || data.error || "Invalid username or password");
        }

        // Save session locally so the dashboard can verify it
        localStorage.setItem(`sb-${PROJECT_ID}-auth-token`, JSON.stringify(data));
        
        statusDiv.textContent = "Success! Redirecting...";
        statusDiv.style.color = "green";
        
        window.location.href = "/dashboard";

      } catch (error) {
        spinnerElement.classList.add('hidden');
        statusDiv.textContent = "Login Error: " + error.message;
        statusDiv.style.color = "red";
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
