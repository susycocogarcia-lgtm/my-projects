  <script>
    const PROJECT_ID = "hyprnlxarrmzbubdkuk";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh5cHJubHhhcnJtemJidWJka3VrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQwMDc0MjcsImV4cCI6MjEwOTU4MzQyN30.p24H1MA2hxCmqElSNgOlDWwhQosXylOrZrLbsbrhVQo"; 

    const statusDiv = document.getElementById('status');
    const spinnerElement = document.getElementById('loading-spinner');
    const submitBtn = document.getElementById('submit-btn');

    // Check for existing session tokens locally before rendering form
    if (localStorage.getItem(`sb-${PROJECT_ID}-auth-token`)) {
      window.location.href = "/dashboard";
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      submitBtn.disabled = true;
      if (spinnerElement) spinnerElement.classList.remove('hidden');
      statusDiv.textContent = "Logging in...";
      statusDiv.style.color = "black";

      const username = document.getElementById('login-username').value.trim().toLowerCase();
      const password = document.getElementById('login-password').value;
      const syntheticEmail = `${username}@projectsa.ink`;

      // Absolute target destination URL path string
      const authEndpoint = `https://${PROJECT_ID}.supabase.co/auth/v1/token?grant_type=password`;

      try {
        // Native Fetch Request with explicit mode declaration to bypass hosting security policies
        const response = await fetch(authEndpoint, {
          method: 'POST',
          mode: 'cors', 
          credentials: 'omit',
          headers: {
            'apikey': SUPABASE_KEY,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            email: syntheticEmail,
            password: password
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error_description || data.error || "Invalid username or password");
        }

        // Write authentication tokens directly to persistent local memory
        localStorage.setItem(`sb-${PROJECT_ID}-auth-token`, JSON.stringify(data));
        
        statusDiv.textContent = "Success! Redirecting...";
        statusDiv.style.color = "green";
        
        window.location.href = "https://projectsa.ink/dashboard";

      } catch (error) {
        if (spinnerElement) spinnerElement.classList.add('hidden');
        
        // Custom debugging text display if the network pipe is blocked by external factors
        if (error.message.includes("fetch")) {
          statusDiv.textContent = "Connection blocked by network security policy. Please check firewall restrictions.";
        } else {
          statusDiv.textContent = "Login Error: " + error.message;
        }
        statusDiv.style.color = "red";
        submitBtn.disabled = false;
      }
    });
  </script>
