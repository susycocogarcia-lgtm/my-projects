<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  
  <!-- Warm up connection tunnels for speed -->
  <link rel="preconnect" href="https://supabase.co" crossorigin>

  <style>
    .hidden { display: none; }
    
    #status-container {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
      min-height: 24px;
      font-weight: bold;
    }

    /* CSS Progress Wheel Animation */
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid #f3f3f3;
      border-top: 2px solid #10b981;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: inline-block;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Status & Spinner Area -->
  <div id="status-container">
    <div id="loading-spinner" class="spinner hidden"></div>
    <div id="status"></div>
  </div>

  <!-- SIGNUP CONTAINER -->
  <div id="auth-container">
    <h2>Create Account</h2>
    <form id="signup-form">
      <input type="text" id="signup-username" placeholder="Choose a Username" required autocomplete="username" />
      <input type="password" id="signup-password" placeholder="Choose a Password" required autocomplete="new-password" />
      <button type="submit" id="submit-btn">Register</button>
    </form>
    
    <p>
      Already have an account? <a href="https://projectsa.ink">Log In here</a>
    </p>
  </div>

  <script>
    const PROJECT_ID = "hyprnlxarrmzbubdkuk";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh5cHJubHhhcnJtemJidWJka3VrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQwMDc0MjcsImV4cCI6MjEwOTU4MzQyN30.p24H1MA2hxCmqElSNgOlDWwhQosXylOrZrLbsbrhVQo"; 

    const statusDiv = document.getElementById('status');
    const spinnerElement = document.getElementById('loading-spinner');
    const submitBtn = document.getElementById('submit-btn');

    document.getElementById('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      // Lock visual interface immediately
      submitBtn.disabled = true;
      spinnerElement.classList.remove('hidden');
      statusDiv.textContent = "Creating account on server...";
      statusDiv.style.color = "black";

      const username = document.getElementById('signup-username').value.trim().toLowerCase();
      const password = document.getElementById('signup-password').value;
      
      // Convert username into a synthetic email string so Supabase Auth processes it cleanly
      const syntheticEmail = `${username}@projectsa.ink`;

      try {
        // High-performance API post directly to your Supabase cloud server sign-up endpoint
        const response = await fetch(`https://${PROJECT_ID}.supabase.co/auth/v1/signup`, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_KEY,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            email: syntheticEmail,
            password: password
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error_description || data.error || data.message || "Registration failed");
        }

        statusDiv.textContent = "Success! Account registered. Forwarding to login page...";
        statusDiv.style.color = "green";
        
        // Wait 1.5 seconds so the user can read the success state before redirecting
        setTimeout(() => {
          window.location.href = "https://projectsa.ink";
        }, 1500);

      } catch (error) {
        spinnerElement.classList.add('hidden');
        statusDiv.textContent = "Signup Error: " + error.message;
        statusDiv.style.color = "red";
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
