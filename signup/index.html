<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <style>
    .hidden { display: none; }
    #status { font-weight: bold; margin-bottom: 15px; }
  </style>
</head>
<body>

  <!-- Status Notification Output Block -->
  <div id="status"></div>

  <!-- SIGNUP MODULE PORTAL -->
  <div id="auth-container">
    <h2>Create Account</h2>
    
    <!-- Configured to pass variables directly through native browser pipelines -->
    <form id="signup-form" method="POST">
      <input type="text" id="signup-username" placeholder="Choose a Username" required autocomplete="username" />
      <input type="password" id="signup-password" placeholder="Choose a Password" required autocomplete="new-password" />
      <button type="submit" id="submit-btn">Register</button>
    </form>
    
    <p>
      Already have an account? <a href="https://projectsa.ink">Log In here</a>
    </p>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const SUPABASE_PROJECT_URL = "https://supabase.co"; 
      const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_zUbPyLcfNxTXRZH0_F3ZeA_b2ufwe1T"; 

      const statusDiv = document.getElementById('status');
      const submitBtn = document.getElementById('submit-btn');
      const signupForm = document.getElementById('signup-form');

      signupForm.addEventListener('submit', (e) => {
        // 1. Temporarily pause standard browser page-refresh loops
        e.preventDefault();
        
        submitBtn.disabled = true;
        statusDiv.textContent = "Writing account data directly to Supabase cloud...";
        statusDiv.style.color = "black";

        const username = document.getElementById('signup-username').value.trim().toLowerCase();
        const password = document.getElementById('signup-password').value;
        const syntheticEmail = `${username}@projectsa.ink`;

        // 2. Point the native form structure directly at your active project URL destination
        signupForm.action = `${SUPABASE_PROJECT_URL}/auth/v1/signup`;

        // 3. Dynamically append structural hidden inputs matching Supabase's API format
        let apiKeyInput = document.getElementById('sb-hidden-apikey');
        if (!apiKeyInput) {
          apiKeyInput = document.createElement('input');
          apiKeyInput.type = 'hidden';
          apiKeyInput.id = 'sb-hidden-apikey';
          apiKeyInput.name = 'apikey';
          signupForm.appendChild(apiKeyInput);
        }
        apiKeyInput.value = SUPABASE_PUBLISHABLE_KEY;

        let emailInput = document.getElementById('sb-hidden-email');
        if (!emailInput) {
          emailInput = document.createElement('input');
          emailInput.type = 'hidden';
          emailInput.id = 'sb-hidden-email';
          emailInput.name = 'email';
          signupForm.appendChild(emailInput);
        }
        emailInput.value = syntheticEmail;

        let passInput = document.getElementById('sb-hidden-pass');
        if (!passInput) {
          passInput = document.createElement('input');
          passInput.type = 'hidden';
          passInput.id = 'sb-hidden-pass';
          passInput.name = 'password';
          signupForm.appendChild(passInput);
        }
        passInput.value = password;

        // 4. Force standard browser transmission over the native browser layer
        signupForm.submit();

        // 5. Provide immediate feedback and trigger the redirect to your clean login path
        statusDiv.textContent = "Success! Account saved to Supabase cloud. Redirecting...";
        statusDiv.style.color = "green";
        
        setTimeout(() => {
          window.location.href = "https://projectsa.ink";
        }, 1500);
      });
    });
  </script>
</body>
</html>
