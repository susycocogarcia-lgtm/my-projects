<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <style>
    .hidden { display: none; }
    #status { font-weight: bold; margin-bottom: 15px; }
  </style>
</head>
<body>

  <div id="status"></div>

  <div id="auth-container">
    <h2>Create Account</h2>
    <form id="signup-form">
      <input type="text" id="signup-username" placeholder="Choose a Username" required autocomplete="username" />
      <input type="password" id="signup-password" placeholder="Choose a Password" required autocomplete="new-password" />
      <button type="submit" id="submit-btn">Register</button>
    </form>
    <p>Already have an account? <a href="https://projectsa.ink">Log In here</a></p>
  </div>

  <script>
    const PROJECT_ID = "hyprnlxarrmzbubdkuk";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh5cHJubHhhcnJtemJidWJka3VrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQwMDc0MjcsImV4cCI6MjEwOTU4MzQyN30.p24H1MA2hxCmqElSNgOlDWwhQosXylOrZrLbsbrhVQo"; 

    const statusDiv = document.getElementById('status');
    const submitBtn = document.getElementById('submit-btn');

    document.getElementById('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      statusDiv.textContent = "Connecting straight to Supabase cloud...";
      statusDiv.style.color = "black";

      const username = document.getElementById('signup-username').value.trim().toLowerCase();
      const password = document.getElementById('signup-password').value;
      const syntheticEmail = `${username}@projectsa.ink`;

      try {
        // Direct Server REST Injection targeting your Supabase authentication layer
        const response = await fetch(`https://${PROJECT_ID}.supabase.co/auth/v1/signup`, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_KEY,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email: syntheticEmail, password: password })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error_description || data.error || data.message || "Registration failed");
        }

        statusDiv.textContent = "Success! Account forced to Supabase. Redirecting to login...";
        statusDiv.style.color = "green";
        
        setTimeout(() => {
          window.location.href = "https://projectsa.ink";
        }, 1500);

      } catch (error) {
        statusDiv.textContent = "Signup Error: " + error.message;
        statusDiv.style.color = "red";
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
