<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <style>
    .hidden { display: none; }
    #status { font-weight: bold; margin-bottom: 15px; }
  </style>
</head>
<body>

  <div id="status"></div>

  <div id="auth-container">
    <h2>Create Account</h2>
    <form id="signup-form">
      <input type="text" id="signup-username" placeholder="Choose a Username" required autocomplete="username" />
      <input type="password" id="signup-password" placeholder="Choose a Password" required autocomplete="new-password" />
      <button type="submit" id="submit-btn">Register</button>
    </form>
    
    <p>
      Already have an account? <a href="https://projectsa.ink">Log In here</a>
    </p>
  </div>

  <!-- UMD script path delivery engine to bundle Supabase globally inside the browser window context -->
  <script src="https://unpkg.com"></script>
  
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const SUPABASE_PROJECT_URL = "https://supabase.co"; 
      const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_zUbPyLcfNxTXRZH0_F3ZeA_b2ufwe1T"; 

      const statusDiv = document.getElementById('status');
      const submitBtn = document.getElementById('submit-btn');

      if (typeof window.supabase === 'undefined') {
          statusDiv.textContent = "Script Initialization Error: Network infrastructure blocked library access.";
          statusDiv.style.color = "red";
          return;
      }

      // Initialize the verified client engine directly
      const supabase = window.supabase.createClient(SUPABASE_PROJECT_URL, SUPABASE_PUBLISHABLE_KEY);

      document.getElementById('signup-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        submitBtn.disabled = true;
        statusDiv.textContent = "Writing account data directly to Supabase cloud...";
        statusDiv.style.color = "black";

        const username = document.getElementById('signup-username').value.trim().toLowerCase();
        const password = document.getElementById('signup-password').value;
        const syntheticEmail = `${username}@projectsa.ink`;

        try {
          // Direct background stream communication using the active library bundle
          const { data, error } = await supabase.auth.signUp({
            email: syntheticEmail,
            password: password
          });

          if (error) {
            throw new Error(error.message);
          }

          statusDiv.textContent = "Success! Account forced to Supabase. Redirecting to login...";
          statusDiv.style.color = "green";
          
          setTimeout(() => {
            window.location.href = "https://projectsa.ink";
          }, 1500);

        } catch (error) {
          statusDiv.textContent = "Signup Error: " + error.message;
          statusDiv.style.color = "red";
          submitBtn.disabled = false;
        }
      });
    });
  </script>
</body>
</html>
