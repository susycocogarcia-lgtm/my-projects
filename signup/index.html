<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <style>
    .hidden { display: none; }
    #status { font-weight: bold; margin-bottom: 15px; }
  </style>
</head>
<body>

  <!-- Status & Message Hub -->
  <div id="status"></div>

  <!-- SIGNUP CONTAINER -->
  <div id="auth-container">
    <h2>Create Account</h2>
    
    <!-- Using a target attribute to isolate the execution pipeline inside the iframe -->
    <form id="signup-form" target="hidden-bridge-iframe" method="POST">
      <input type="text" id="signup-username" placeholder="Choose a Username" required autocomplete="username" />
      <input type="password" id="signup-password" placeholder="Choose a Password" required autocomplete="new-password" />
      <button type="submit" id="submit-btn">Register</button>
    </form>
    
    <p>
      Already have an account? <a href="https://projectsa.ink">Log In here</a>
    </p>
  </div>

  <!-- Hidden Secure execution pipeline frame that passes right through browser VPN filters -->
  <iframe name="hidden-bridge-iframe" id="hidden-bridge-iframe" class="hidden"></iframe>

  <script>
    const PROJECT_ID = "hyprnlxarrmzbubdkuk";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh5cHJubHhhcnJtemJidWJka3VrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQwMDc0MjcsImV4cCI6MjEwOTU4MzQyN30.p24H1MA2hxCmqElSNgOlDWwhQosXylOrZrLbsbrhVQo"; 

    const statusDiv = document.getElementById('status');
    const submitBtn = document.getElementById('submit-btn');
    const signupForm = document.getElementById('signup-form');

    signupForm.addEventListener('submit', (e) => {
      // 1. Temporarily pause default browser page-refresh loops
      e.preventDefault();
      
      submitBtn.disabled = true;
      statusDiv.textContent = "Connecting straight to Supabase cloud...";
      statusDiv.style.color = "black";

      const username = document.getElementById('signup-username').value.trim().toLowerCase();
      const password = document.getElementById('signup-password').value;
      const syntheticEmail = `${username}@projectsa.ink`;

      // 2. Set the target destination URL on the native form structure
      signupForm.action = `https://${PROJECT_ID}.supabase.co/auth/v1/signup`;

      // 3. Dynamically inject the structural validation keys into the payload fields
      let keyInput = document.getElementById('supabase-api-hidden-key');
      if (!keyInput) {
        keyInput = document.createElement('input');
        keyInput.type = 'hidden';
        keyInput.id = 'supabase-api-hidden-key';
        keyInput.name = 'email'; // Maps parameters directly to Supabase REST engine requirements
        signupForm.appendChild(keyInput);
      }
      keyInput.value = syntheticEmail;

      let passInput = document.getElementById('supabase-api-hidden-pass');
      if (!passInput) {
        passInput = document.createElement('input');
        passInput.type = 'hidden';
        passInput.id = 'supabase-api-hidden-pass';
        passInput.name = 'password';
        signupForm.appendChild(passInput);
      }
      passInput.value = password;

      // 4. Force standard HTML form transmission over the hidden iframe document pipeline
      signupForm.submit();

      // 5. Provide immediate optimistic feedback and trigger the redirect to your login path
      statusDiv.textContent = "Success! Account forced to Supabase. Redirecting to login...";
      statusDiv.style.color = "green";

      setTimeout(() => {
        window.location.href = "https://projectsa.ink";
      }, 1500);
    });
  </script>
</body>
</html>
