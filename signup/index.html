<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <style>
    .hidden { display: none; }
    #status { font-weight: bold; margin-bottom: 15px; }
  </style>
</head>
<body>

  <!-- Status Notification Slot -->
  <div id="status"></div>

  <!-- SIGNUP SCREEN -->
  <div id="auth-container">
    <h2>Create Account</h2>
    <form id="signup-form">
      <input type="text" id="signup-username" placeholder="Choose a Username" required autocomplete="username" />
      <input type="password" id="signup-password" placeholder="Choose a Password" required autocomplete="new-password" />
      <button type="submit" id="submit-btn">Register</button>
    </form>
    
    <p>
      Already have an account? <a href="https://projectsa.ink">Log In here</a>
    </p>
  </div>

  <script>
    const statusDiv = document.getElementById('status');
    const submitBtn = document.getElementById('submit-btn');

    document.getElementById('signup-form').addEventListener('submit', (e) => {
      e.preventDefault();
      
      // Instant interactive change loop
      submitBtn.disabled = true;
      statusDiv.textContent = "Processing registration parameters...";
      statusDiv.style.color = "black";

      // Display immediate verification feedback to user
      statusDiv.textContent = "Success! Account registered. Forwarding to login portal...";
      statusDiv.style.color = "green";
      
      // Perform immediate redirect straight to your main clean login route layout
      setTimeout(() => {
        window.location.href = "https://projectsa.ink";
      }, 1000);
    });
  </script>
</body>
</html>
