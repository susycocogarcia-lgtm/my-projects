<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <style>
    body { font-family: sans-serif; max-width: 350px; margin: 80px auto; padding: 25px; border: 1px solid #ddd; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    h2 { margin-bottom: 20px; text-align: center; }
    form { display: flex; flex-direction: column; gap: 12px; }
    input, button { padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
    button { background-color: #10b981; color: white; border: none; cursor: pointer; font-weight: bold; }
    button:hover { background-color: #059669; }
    .footer-text { margin-top: 15px; text-align: center; font-size: 14px; color: #555; }
    .footer-text a { color: #10b981; text-decoration: none; }
    .footer-text a:hover { text-decoration: underline; }
    #status { font-size: 14px; text-align: center; margin-bottom: 15px; font-weight: bold; }
  </style>
</head>
<body>

  <h2>Create Account</h2>
  <div id="status"></div>

  <form id="signup-form">
    <input type="text" id="signup-username" placeholder="Choose a Username" required />
    <input type="password" id="signup-password" placeholder="Choose a Password" required />
    <button type="submit">Register</button>
  </form>
  
  <p class="footer-text">
    Already have an account? <a href="https://projectsa.ink/login">Log In here</a>
  </p>

  <!-- Load Supabase from CDN -->
  <script src="https://jsdelivr.net"></script>
  
  <!-- JavaScript Logic -->
  <script>
    // 1. Initialize Supabase
    const SUPABASE_URL = "https://supabase.co"; 
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh5cHJubHhhcnJtemJidWJka3VrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQwMDc0MjcsImV4cCI6MjEwOTU4MzQyN30.p24H1MA2hxCmqElSNgOlDWwhQosXylOrZrLbsbrhVQo"; 

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const statusDiv = document.getElementById('status');

    // 2. Handle Account Registration
    document.getElementById('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      statusDiv.textContent = "Creating account...";
      statusDiv.style.color = "blue";

      const username = document.getElementById('signup-username').value.trim().toLowerCase();
      const password = document.getElementById('signup-password').value;

      // Convert username to the matching pseudo-email structure
      const syntheticEmail = `${username}@projectsa.ink`;

      const { data, error } = await supabase.auth.signUp({
        email: syntheticEmail,
        password: password
      });

      if (error) {
        statusDiv.textContent = "Signup Error: " + error.message;
        statusDiv.style.color = "#d3fix2f2f";
      } else {
        statusDiv.textContent = "Success! Redirecting to login page...";
        statusDiv.style.color = "green";
        
        // Wait 1.5 seconds so the user can see the success message, then redirect
        setTimeout(() => {
          window.location.href = "https://projectsa.ink/login";
        }, 1500);
      }
    });
  </script>
</body>
</html>
